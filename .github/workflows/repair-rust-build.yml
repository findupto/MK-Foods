name: Repair Rust Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair known Rust type errors
        shell: python
        run: |
          from pathlib import Path
          p = Path('src-tauri/src/main.rs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'x.insert(k.clone(),v.clone())}}arr(&mut s.db,"audit")': 'x.insert(k.clone(),v.clone());}}arr(&mut s.db,"audit")',
              'entry(k.clone()).or_insert(v.clone())}if let Some(ps)': 'entry(k.clone()).or_insert(v.clone());}if let Some(ps)',
              'json!(if status=="completed"{"done"}else{status.clone()})': 'json!(if status=="completed"{"done"}else{status.as_str()})',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Commit repair if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/main.rs
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "fix: repair Rust type errors in POS backend"
          git push origin main
