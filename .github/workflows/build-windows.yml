name: Build MK Foods POS Windows Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Renderer and API tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --include=dev

      - name: Run tests
        run: npm test

  build-windows:
    name: Build x64, x86 and ARM64 NSIS installers
    needs: tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build all Windows installers with automatic MSVC fallback
        shell: powershell
        run: .\build-windows.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MK-Foods-POS-Windows-Installers
          path: dist/*-setup.exe
          if-no-files-found: error
