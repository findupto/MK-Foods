[package]
name = "mk-foods-pos"
version = "2.3.0"
edition = "2021"
description = "Enterprise Point-of-Sale System for MK Pizza & Ice Bar"
authors = ["MK Foods Team"]
license = "MIT"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }

# Cryptography & Security
