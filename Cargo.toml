[package]
name = "mk-foods-pos"
version = "2.0.0"
edition = "2021"
description = "Enterprise Point-of-Sale System for MK Pizza & Ice Bar - Complete with Banking, Printing, Compliance"

[dependencies]
tauri = { version = "2", features = ["shell-open"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
tokio = { version = "1", features = ["full"] }

# Cryptography & Security
pbkdf2 = "0.12"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
subtile = "2"
zeroize = "1"
ring = "0.17"
jsonwebtoken = "9"

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
sqlciper = "0.5"

# HTTP & Networking
reqwest = { version = "0.11", features = ["json", "cookies", "stream"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression"] }
tokio-tungstenite = "0.21"

# Bluetooth & Device Discovery
bt-obex = "0.3"
blurso = "0.3"
blues = "0.5"

# USB Printer Support
rusb = "0.9"

# Payment Processing
stripe = "0.15"

# Compression & Serialization
flate2 = "1"
base64 = "0.21"
uuid = { version = "1", features = ["v4", "serde"] }

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Compliance & Audit
sha-1 = "0.10"
hmac = "0.12"

# Error Handling
anyhow = "1"
thiserror = "1"

# Utilities
lazy_static = "1"
once_cell = "1"

[build-dependencies]
tauri-build = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
